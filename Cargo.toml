[package]
name = "ygit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
eframe = "0.32"
egui = "0.32"
rfd = "0.17.2"
russh = { version = "0.63.0", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
